name: Deploy

# Runs after CI passes on main, or by hand (Actions > Deploy > Run workflow).
# 1. Publishes the API image to GitHub Container Registry (always).
# 2. Deploys the API to Azure Container Apps and the web app to Azure Static Web Apps,
#    once Azure is set up (repository variable AZURE_DEPLOY = true). See docs/DEPLOYMENT.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/signalsafe-api
  COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  api-image:
    name: Publish API image
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/SignalSafe.Api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.COMMIT }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=SignalSafe API
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-api:
    name: Deploy API to Azure Container Apps
    needs: api-image
    if: vars.AZURE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Update the container app to this commit's image
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors -o none
          az containerapp update -n signalsafe-api -g signalsafe-rg --image "$IMAGE:$COMMIT" -o none
          echo "Deployed $IMAGE:$COMMIT" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the API answers
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "${{ vars.API_URL }}/health"; then exit 0; fi
            sleep 10
          done
          echo "The API did not answer /health within 2 minutes" && exit 1

  deploy-web:
    name: Deploy web app to Azure Static Web Apps
    needs: api-image
    if: vars.AZURE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.API_URL }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true
          skip_api_build: true
